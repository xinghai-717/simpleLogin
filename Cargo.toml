[package]
name = "simple_login"
version = "0.1.1"
edition = "2024"

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 16
lto = false
incremental = true

[dependencies]
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["glow", "persistence"] }
html-escape = "0.3.0"
keyring = "4.2.0"
mac_address = "1.2.1"
num-bigint = "0.5.1"
regex = "1.13.1"
reqwest = { version = "0.13.5" , features = ["blocking", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
sysinfo = "0.40.1"
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
url = "2.5.8"
keyring-search = "1.2.2"
shipup = "0.5.1"
